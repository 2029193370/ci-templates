version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    labels: ['dependencies', 'npm']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-all:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    labels: ['dependencies', 'python']
    commit-message:
      prefix: 'chore(deps)'
