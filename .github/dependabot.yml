version: 2
updates:
  # Keep workflow action references fresh without assuming this repository, or
  # a repository generated from this template, already has application manifests.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 3
    labels: ['dependencies', 'github-actions', 'security']
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      all-actions:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
