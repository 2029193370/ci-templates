name: Template Cleanup

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository != '2029193370/ci-templates'
    name: Remove ci-templates source files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Stop if cleanup already ran
        id: marker
        run: |
          if [ -f .ci-template-source ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove source-only files
        if: steps.marker.outputs.run == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          git rm -rf --ignore-unmatch \
            .ci-template-source \
            .github/CODEOWNERS \
            .github/ISSUE_TEMPLATE \
            .github/PULL_REQUEST_TEMPLATE.md \
            .github/rulesets \
            .github/zizmor.yml \
            .github/workflows/ci-lint.yml \
            .github/workflows/codeql.yml \
            .github/workflows/commitlint.yml \
            .github/workflows/gitleaks.yml \
            .github/workflows/pages.yml \
            .github/workflows/release-attest.yml \
            .github/workflows/release-please.yml \
            .github/workflows/scorecard.yml \
            .github/workflows/selftest.yml \
            .github/workflows/template-cleanup.yml \
            .github/workflows/zizmor.yml \
            .release-please-config.json \
            .release-please-manifest.json \
            _pins.json \
            CHANGELOG.md \
            README.zh-CN.md \
            docs \
            scripts \
            starter \
            tests

          cat > README.md <<EOF
          # ${REPO_NAME}

          This repository was initialized from the ci-templates GitHub template.

          CI is already enabled in \`.github/workflows/ci.yml\`. Add your application
          code, push to \`main\`, and the workflow will detect supported stacks and run
          the relevant checks through \`.github/workflows/reusable-ci.yml\`.
          EOF

      - name: Commit cleanup
        if: steps.marker.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No template cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore: initialize repository from ci template [skip ci]"
          if ! git push; then
            echo "::warning::Template cleanup commit could not be pushed. Check repository workflow token permissions, then remove .ci-template-source and source-only files manually if needed."
          fi
